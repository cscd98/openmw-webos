name: Build OpenMW (webOS)

on:
  push:
    branches:
      - master
      - main
  pull_request:
  release:
    types:
      - published

env:
  PACKAGE_NAME: com.cscd98.openmw
  OPENMW_VERSION: 0.0.1

jobs:
  build-arm:
    runs-on: ubuntu-latest
    env:
      WITH_FFMPEG: ON

    steps:
      - name: Set version from tag
        if: github.event_name == 'release'
        run: |
          echo "OPENMW_VERSION=${GITHUB_REF_NAME}" >> $GITHUB_ENV

      - name: Check Out Repo
        uses: actions/checkout@v7

      - name: Download ares-cli-rs
        uses: robinraju/release-downloader@v1
        with:
          repository: "webosbrew/ares-cli-rs"
          latest: true
          fileName: "ares-package_*_amd64.deb"
          out-file-path: "temp"

      - name: Download Manifest Generator
        uses: robinraju/release-downloader@v1
        with:
          repository: "webosbrew/dev-toolbox-cli"
          latest: true
          fileName: "webosbrew-toolbox-gen-manifest_*.deb"
          out-file-path: "temp"

      - name: Update packages
        run: sudo apt-get -yq update

      - name: Install host dependencies
        run: |
          sudo apt-get -yq install \
            cmake \
            git \
            tar \
            gcc-multilib \
            g++-multilib \
            ./temp/ares-package_*_amd64.deb \
            ./temp/webosbrew-toolbox-gen-manifest_*.deb

      - name: Download webOS (arm) NDK
        uses: robinraju/release-downloader@v1
        with:
          repository: "openlgtv/buildroot-nc4"
          latest: true
          fileName: "arm-webos-linux-gnueabi_sdk-buildroot-x86_64.tar.gz"
          out-file-path: "/tmp"

      - name: Extract webOS NDK
        shell: bash
        working-directory: /tmp
        run: |
          tar xzf arm-webos-linux-gnueabi_sdk-buildroot-x86_64.tar.gz
          ./arm-webos-linux-gnueabi_sdk-buildroot/relocate-sdk.sh

      - name: Download SDL2 (webOS ABI)
        uses: robinraju/release-downloader@v1
        with:
          repository: "webosbrew/SDL-webOS"
          latest: true
          fileName: "SDL2-*-webos-abi.tar.gz"
          out-file-path: "/tmp"

      - name: Extract SDL2
        shell: bash
        working-directory: /tmp
        run: |
          mkdir -p sdl2-webos
          tar xzf SDL2-*-webos-abi.tar.gz -C sdl2-webos

      - name: Clone gl4es
        run: |
          git clone https://github.com/ptitSeb/gl4es.git

      - name: Build gl4es
        run: |
          . /tmp/arm-webos-linux-gnueabi_sdk-buildroot/environment-setup
          mkdir -p gl4es/build
          cd gl4es/build

          /usr/bin/cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DNOX11=ON

          make -j$(nproc)

      - name: Install gl4es into sysroot
        run: |
          . /tmp/arm-webos-linux-gnueabi_sdk-buildroot/environment-setup
          mkdir -p $STAGING_DIR/usr/include/GL
          cp -av gl4es/lib/libGL.so* $STAGING_DIR/usr/lib/
          ln -sf libGL.so.1 $STAGING_DIR/usr/lib/libGL.so
          cp -av gl4es/include/GL/*.h $STAGING_DIR/usr/include/GL/

      - name: Clone lz4
        run: |
          git clone https://github.com/lz4/lz4.git

      - name: Build and install lz4 into staging
        run: |
          . /tmp/arm-webos-linux-gnueabi_sdk-buildroot/environment-setup
          cd lz4
          make -j$(nproc)
          make install PREFIX=$STAGING_DIR/usr

      - name: Clone ffmpeg
        run: |
          git clone --branch n4.4 https://github.com/FFmpeg/FFmpeg.git ffmpeg

      - name: Configure ffmpeg
        run: |
          . /tmp/arm-webos-linux-gnueabi_sdk-buildroot/environment-setup
          cd ffmpeg
          ./configure \
            --prefix=$STAGING_DIR/usr \
            --cross-prefix=${CROSS_COMPILE} \
            --arch=arm \
            --target-os=linux \
            --enable-cross-compile \
            --disable-debug \
            --disable-doc \
            --disable-programs \
            --disable-everything \
            --enable-shared \
            --enable-avcodec \
            --enable-avformat \
            --enable-avutil \
            --enable-swresample \
            --enable-swscale \
            --enable-zlib \
            --enable-pic

      - name: Build ffmpeg
        run: |
          . /tmp/arm-webos-linux-gnueabi_sdk-buildroot/environment-setup
          cd ffmpeg
          make -j$(nproc)
          make install

      - name: Download Boost
        run: |
          wget -O boost.tar.gz \
            https://github.com/boostorg/boost/releases/download/boost-1.83.0/boost-1.83.0.tar.gz

          tar -xzf boost.tar.gz
          mv boost-1.83.0 boost

      - name: Build boost
        run: |
          . /tmp/arm-webos-linux-gnueabi_sdk-buildroot/environment-setup

          cd boost

          ./bootstrap.sh --with-libraries=iostreams,program_options,system,filesystem,regex,atomic
          cat > user-config.jam <<EOF
          using gcc : $(${CC} -dumpversion) : ${CXX} :
              <cxxflags>"${CXXFLAGS}"
              <linkflags>"${LDFLAGS}" ;
          EOF

          ./b2 \
          toolset=gcc \
          threading=multi \
          abi=aapcs \
          variant=release \
          link=shared \
          runtime-link=shared \
          architecture=arm \
          address-model=32 \
          --ignore-site-config \
          --layout=system \
          --user-config=./user-config.jam \
          --prefix=$STAGING_DIR/usr \
          install

      - name: Clone OpenAL Soft
        run: |
          git clone https://github.com/kcat/openal-soft.git

      - name: Build OpenAL Soft
        run: |
          . /tmp/arm-webos-linux-gnueabi_sdk-buildroot/environment-setup

          mkdir -p openal-soft/build
          cd openal-soft/build

          /usr/bin/cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=$STAGING_DIR/usr \
            -DCMAKE_TOOLCHAIN_FILE=$CMAKE_TOOLCHAIN_FILE \
            -DLIBTYPE=SHARED \
            -DALSOFT_EXAMPLES=OFF \
            -DALSOFT_UTILS=OFF \
            -DALSOFT_TESTS=OFF \
            -DALSOFT_CONFIG=OFF

          make -j$(nproc)
          make install

      - name: Install Qt6 host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build \
            build-essential \
            cmake \
            g++ \
            gcc \
            pkg-config \
            libgl1-mesa-dev
          sudo apt-get install -y \
            qt6-base-dev \
            qt6-base-dev-tools \
            qt6-tools-dev \
            qt6-tools-dev-tools \
            qt6-declarative-dev \
            qt6-shadertools-dev \
            qt6-wayland-dev

      - name: Build Qt6 host
        run: |
          export PATH=/usr/bin:/bin

          git clone --branch v6.4.2 --depth 1 https://code.qt.io/qt/qt5.git qt6-host
          cd qt6-host
          perl init-repository --module-subset=qtbase,qttools

          mkdir build-host
          cd build-host

          cmake ../qtbase \
            -GNinja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=$HOME/qt6-host \
            -DQT_BUILD_TOOLS=ON \
            -DQT_BUILD_EXAMPLES=OFF \
            -DQT_BUILD_TESTS=OFF \
            -DBUILD_SHARED_LIBS=ON

          /usr/bin/cmake --build . --parallel
          /usr/bin/cmake --install .

      - name: Verify Qt6 host tools
        run: |
          ls -la /home/runner/qt6-host/lib/cmake/Qt6CoreTools/ || echo "MISSING Qt6CoreTools"
          find /home/runner/qt6-host -name "moc" -type f

      - name: Build Qt6
        run: |
          . /tmp/arm-webos-linux-gnueabi_sdk-buildroot/environment-setup
          export PATH=/usr/bin:$PATH

          git clone --branch v6.4.2 --depth 1 https://code.qt.io/qt/qtbase.git
          cd qtbase

          mkdir build
          cd build

          export QT_HOST_PATH=/home/runner/qt6-host
          export CMAKE_PREFIX_PATH=/home/runner/qt6-host
          export Qt6CoreTools_DIR=/home/runner/qt6-host/lib/cmake/Qt6CoreTools
          export Qt6HostInfo_DIR=/home/runner/qt6-host/lib/cmake/Qt6HostInfo

          ../configure \
            -release \
            -qt-host-path "$QT_HOST_PATH" \
            -prefix "$STAGING_DIR/usr" \
            -extprefix "$STAGING_DIR/usr" \
            -sysroot "$STAGING_DIR" \
            -nomake examples \
            -nomake tests \
            -opengl es2 \
            -- \
            -DQT_HOST_PATH_CMAKE_DIR="$QT_HOST_PATH/lib/cmake" \
            -DCMAKE_CXX_FLAGS="${CXXFLAGS} -DEM_AARCH64=183"

          /usr/bin/cmake --build . --parallel $(nproc)
          /usr/bin/cmake --install .

      - name: Build Qt6 Tools
        run: |
          . /tmp/arm-webos-linux-gnueabi_sdk-buildroot/environment-setup
          export PATH=/usr/bin:$PATH

          git clone --branch v6.4.2 --depth 1 https://code.qt.io/qt/qttools.git
          mkdir qttools-build
          cd qttools-build

          export QT_HOST_PATH=/home/runner/qt6-host
          export CMAKE_PREFIX_PATH=/home/runner/qt6-host
          export Qt6CoreTools_DIR=/home/runner/qt6-host/lib/cmake/Qt6CoreTools
          export Qt6HostInfo_DIR=/home/runner/qt6-host/lib/cmake/Qt6HostInfo

          "$STAGING_DIR/usr/bin/qt-configure-module" \
            ../qttools \
            -qt-host-path "$QT_HOST_PATH"

          /usr/bin/cmake --build . --parallel $(nproc)
          /usr/bin/cmake --install .

      - name: Build Qt6 Tools (target)
        run: |
          . /tmp/arm-webos-linux-gnueabi_sdk-buildroot/environment-setup
          export PATH=/usr/bin:$PATH

          git clone --branch v6.4.2 --depth 1 https://code.qt.io/qt/qttools.git

          mkdir -p qttools/build
          cd qttools/build

          export QT_HOST_PATH=/home/runner/qt6-host

          /usr/bin/cmake .. \
            -GNinja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=$CMAKE_TOOLCHAIN_FILE \
            -DCMAKE_INSTALL_PREFIX=$STAGING_DIR/usr \
            -DCMAKE_PREFIX_PATH="$STAGING_DIR/usr;$QT_HOST_PATH" \
            -DQT_HOST_PATH="$QT_HOST_PATH" \
            -DQT_BUILD_TOOLS=ON \
            -DQT_BUILD_TESTS=OFF \
            -DQT_BUILD_EXAMPLES=OFF

          /usr/bin/cmake --build . --parallel $(nproc)
          /usr/bin/cmake --install .

      - name: Clone LuaJIT
        run: |
          git clone https://github.com/LuaJIT/LuaJIT.git luajit

      - name: Build LuaJIT
        run: |
          . /tmp/arm-webos-linux-gnueabi_sdk-buildroot/environment-setup

          cd luajit

          make -j$(nproc) \
            HOST_CC="gcc -m32" \
            CROSS=${CROSS_COMPILE} \
            TARGET_SYS=Linux \
            TARGET_FLAGS="${CFLAGS}"

          make install \
            PREFIX=$STAGING_DIR/usr

      - name: Build minizip
        run: |
          . /tmp/arm-webos-linux-gnueabi_sdk-buildroot/environment-setup

          git clone https://github.com/zlib-ng/minizip-ng.git
          cd minizip-ng

          mkdir build
          cd build

          /usr/bin/cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=$STAGING_DIR/usr \
            -DBUILD_SHARED_LIBS=ON \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DMZ_COMPAT=ON \
            -DMZ_ZLIB=ON \
            -DMZ_PPMD=OFF \
            -DMZ_BZIP2=OFF \
            -DMZ_LZMA=OFF \
            -DMZ_ZSTD=OFF \
            -DMZ_PKCRYPT=OFF \
            -DMZ_WZAES=OFF \
            -DMZ_OPENSSL=OFF

          make -j$(nproc)
          make install

      - name: Build libcollada-dom
        run: |
          . /tmp/arm-webos-linux-gnueabi_sdk-buildroot/environment-setup

          git clone https://github.com/rdiankov/collada-dom.git
          cd collada-dom

          mkdir build
          cd build

          /usr/bin/cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=$STAGING_DIR/usr \
            -DBUILD_SHARED_LIBS=ON \
            -DCOLLADA_DOM_SUPPORT141=ON \
            -DCOLLADA_DOM_SUPPORT150=ON

          make -j$(nproc)
          make install

      - name: Clone OpenSceneGraph
        run: |
          git clone https://github.com/openscenegraph/OpenSceneGraph.git
          cd OpenSceneGraph
          git checkout OpenSceneGraph-3.6.5
          git rev-parse HEAD > ../osg_commit.txt

      - name: Build OpenSceneGraph
        run: |
          . /tmp/arm-webos-linux-gnueabi_sdk-buildroot/environment-setup

          mkdir -p OpenSceneGraph/build
          cd OpenSceneGraph/build

          /usr/bin/cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=$STAGING_DIR/usr \
            -DBUILD_OSG_APPLICATIONS=OFF \
            -DOPENGL_PROFILE="GL2" \
            -DOSG_WINDOWING_SYSTEM="None" \
            -DRUN_RESULT_VAR=0 \
            -DCOMPILE_RESULT_VAR=TRUE \
            -D_OPENTHREADS_ATOMIC_USE_GCC_BUILTINS_EXITCODE=0

          make -j$(nproc)

      - name: Install OpenSceneGraph
        run: |
          . /tmp/arm-webos-linux-gnueabi_sdk-buildroot/environment-setup
          cd OpenSceneGraph/build
          make install

      - name: Clone OpenMW
        run: |
          git clone https://gitlab.com/OpenMW/openmw.git
          cd openmw
          git rev-parse HEAD > ../openmw_commit.txt

      - name: Patch OpenMW default data path
        run: |
          cd openmw

          sed -i \
            's|^data=${OPENMW_RESOURCE_FILES}/vfs-mw$|data=/media/developer/tmp/openmw/Data Files|' \
            files/openmw.cfg

          grep -q '^content=Morrowind.esm$' files/openmw.cfg || printf '\ncontent=Morrowind.esm\n' >> files/openmw.cfg

      - name: Patch OpenMW for webOS
        run: |
          cd openmw
          git apply ../patches/0001-platform-webos.patch

      - name: Build OpenMW
        run: |
          . /tmp/arm-webos-linux-gnueabi_sdk-buildroot/environment-setup
          mkdir -p openmw/build
          cd openmw/build

          /usr/bin/cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DQT_HOST_PATH=/home/runner/qt6-host \
            -DQt6HostInfo_DIR=/home/runner/qt6-host/lib/cmake/Qt6HostInfo \
            -DQt6CoreTools_DIR=/home/runner/qt6-host/lib/cmake/Qt6CoreTools \
            -DCMAKE_PREFIX_PATH="$STAGING_DIR/usr;/home/runner/qt6-host" \
            -DBUILD_LAUNCHER=ON \
            -DBUILD_ESSIMPORTER=OFF \
            -DBUILD_WIZARD=OFF \
            -DBUILD_OPENCS=OFF \
            -DBUILD_BSATOOL=OFF \
            -DBUILD_ESMTOOL=OFF \
            -DBUILD_NIFTEST=OFF \
            -DBUILD_NAVMESHTOOL=OFF \
            -DBUILD_BULLETOBJECTTOOL=OFF \
            -DPRECOMPILE_HEADERS_WITH_MSVC=OFF \
            -DOPENMW_USE_SYSTEM_YAML_CPP=OFF \
            -DOPENMW_USE_SYSTEM_BULLET=OFF \
            -DOPENMW_USE_SYSTEM_MYGUI=OFF \
            -DOPENMW_USE_SYSTEM_RECASTNAVIGATION=OFF \
            -DMYGUI_RENDERSYSTEM=8 \
            -DOSG_STATIC=OFF \
            -DOPENGL_gl_LIBRARY="$STAGING_DIR/usr/lib/libGL.so" \
            -DOPENGL_opengl_LIBRARY="$STAGING_DIR/usr/lib/libGL.so" \
            -DRUN_RESULT_VAR=1 \
            -DCMAKE_CXX_FLAGS="${CXXFLAGS} \
            -DGL_COMPRESSED_SRGB_S3TC_DXT1_EXT=0x8C4C \
            -DGL_COMPRESSED_SRGB_ALPHA_S3TC_DXT1_EXT=0x8C4D \
            -DGL_COMPRESSED_SRGB_ALPHA_S3TC_DXT3_EXT=0x8C4E \
            -DGL_COMPRESSED_SRGB_ALPHA_S3TC_DXT5_EXT=0x8C4F" \
            -DCMAKE_INSTALL_PREFIX="/media/developer/apps/usr/palm/applications/com.cscd98.openmw"

          /usr/bin/cmake --build . --parallel $(nproc)

      - name: Install OpenMW
        run: |
          . /tmp/arm-webos-linux-gnueabi_sdk-buildroot/environment-setup

          APPDIR="$GITHUB_WORKSPACE/webos/arm/package/${PACKAGE_NAME}"
          PREFIX="/media/developer/apps/usr/palm/applications/com.cscd98.openmw"

          mkdir -p "${APPDIR}"
          mkdir -p "${APPDIR}/lib"
          mkdir -p "${APPDIR}/lib/osgPlugins-3.6.5"

          cd openmw/build

          DESTDIR="${APPDIR}" /usr/bin/cmake --install .

          arm-webos-linux-gnueabi-strip \
            "${APPDIR}${PREFIX}/bin/openmw"

          arm-webos-linux-gnueabi-strip \
            "${APPDIR}${PREFIX}/bin/openmw-launcher"

          arm-webos-linux-gnueabi-strip \
            "${APPDIR}${PREFIX}/bin/openmw-iniimporter"

      - name: Resolve version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            VERSION="${{ github.event.release.tag_name }}"
          else
            VERSION="${OPENMW_VERSION:-nightly}"
          fi

          echo "OPENMW_VERSION=$VERSION" >> $GITHUB_ENV

      - name: Package IPK
        run: |
          . /tmp/arm-webos-linux-gnueabi_sdk-buildroot/environment-setup

          APPDIR="$GITHUB_WORKSPACE/webos/arm/package/${PACKAGE_NAME}"
          PREFIX="/media/developer/apps/usr/palm/applications/com.cscd98.openmw"
          APPROOT="${APPDIR}${PREFIX}"

          mkdir -p "${APPROOT}/lib"
          mkdir -p "${APPROOT}/lib/osgPlugins-3.6.5"

          cp -av /tmp/sdl2-webos/lib/*.so* "${APPROOT}/lib"

          mv "${APPROOT}/bin/openmw-launcher" "${APPROOT}/openmw-launcher"

          cp -av gl4es/lib/libGL.so* "${APPROOT}/lib"
          ln -sf libGL.so.1 "${APPROOT}/lib/libGL.so"

          cp -av "$STAGING_DIR/usr/lib/liblz4.so"* "${APPROOT}/lib"

          cp -av "$STAGING_DIR/usr/lib/libicuuc.so"* "${APPROOT}/lib"
          cp -av "$STAGING_DIR/usr/lib/libicui18n.so"* "${APPROOT}/lib"
          cp -av "$STAGING_DIR/usr/lib/libicudata.so"* "${APPROOT}/lib"

          cp -av "$STAGING_DIR/usr/lib/libstdc++.so"* "${APPROOT}/lib"

          cp -av "$STAGING_DIR/usr/lib/libosg"*.so* "${APPROOT}/lib"
          cp -av "$STAGING_DIR/usr/lib/libOpenThreads.so"* "${APPROOT}/lib"
          cp -av "$STAGING_DIR/usr/lib/osgPlugins-3.6.5/"* "${APPROOT}/lib/osgPlugins-3.6.5"

          if [ "${WITH_FFMPEG:-OFF}" = "ON" ]; then
          cp -av "$STAGING_DIR/usr/lib/libavcodec.so"* "${APPROOT}/lib"
          cp -av "$STAGING_DIR/usr/lib/libavformat.so"* "${APPROOT}/lib"
          cp -av "$STAGING_DIR/usr/lib/libavutil.so"* "${APPROOT}/lib"
          cp -av "$STAGING_DIR/usr/lib/libswscale.so"* "${APPROOT}/lib"
          cp -av "$STAGING_DIR/usr/lib/libswresample.so"* "${APPROOT}/lib"
          fi

          cp -av "$STAGING_DIR/usr/lib/libboost_"*.so* "${APPROOT}/lib"

          cp -av "$STAGING_DIR/usr/lib/libopenal.so"* "${APPROOT}/lib"
          ln -sf libopenal.so.1.25.2 "${APPROOT}/lib/libopenal.so.1"

          cp -av "$STAGING_DIR/usr/lib/libminizip.so"* "${APPROOT}/lib"

          cp -av "$STAGING_DIR/usr/lib/libluajit-5.1.so"* "${APPROOT}/lib/"

          # Qt6 runtime
          cp -av $STAGING_DIR/usr/lib/libQt6* ${APPDIR}/lib

          # Qt plugins
          mkdir -p ${APPDIR}/plugins
          cp -av $STAGING_DIR/usr/plugins/* ${APPDIR}/plugins/

          cp -av dist/ipk/icon.png "${APPROOT}"

          cat > "${APPROOT}/appinfo.json" <<EOF
          {
          "id": "${PACKAGE_NAME}",
          "version": "${OPENMW_VERSION}",
          "type": "native",
          "title": "OpenMW",
          "main": "openmw-launcher",
          "icon": "icon.png"
          }
          EOF

          ares-package "${APPROOT}" -o webos/arm

      - name: Compute IPK filename
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF#refs/tags/}"
            echo "IPK_NAME=${PACKAGE_NAME}_${OPENMW_VERSION}_${TAG}.ipk" >> $GITHUB_ENV
          else
            echo "IPK_NAME=${PACKAGE_NAME}_${OPENMW_VERSION}_all.ipk" >> $GITHUB_ENV
          fi

      - name: Rename IPK to final name
        shell: bash
        run: |
          mv webos/arm/*.ipk "webos/arm/${IPK_NAME}"

      - name: Generate Manifest
        shell: bash
        run: |
          webosbrew-gen-manifest \
            -o webos/${PACKAGE_NAME}.manifest.json \
            -p "webos/arm/${IPK_NAME}" \
            -i https://github.com/cscd98/openmw-webos/raw/main/dist/ipk/icon.png \
            -l https://github.com/cscd98/openmw-webos

      - name: Upload default artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.PACKAGE_NAME }}_${{ env.OPENMW_VERSION }}_${{ github.sha }}_arm.ipk
          path: webos/arm/${{ env.IPK_NAME }}
          archive: false

      - name: Release
        if: github.event_name == 'release'
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.event.release.tag_name }}
          allowUpdates: true
          omitNameDuringUpdate: true
          omitBody: true
          omitPrereleaseDuringUpdate: true
          artifacts: |
            webos/arm/${{ env.IPK_NAME }}
            webos/${{ env.PACKAGE_NAME }}.manifest.json
